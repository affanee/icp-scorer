name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run the pipeline in mock mode
        # No API key and no network calls in CI. Fixtures + mock mode prove the
        # whole pipeline still runs on every push.
        run: PYTHONPATH=src python -m icp_scorer score --input data/domains_demo.csv --mock --fixtures data/fixtures
