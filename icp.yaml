# ─────────────────────────────────────────────────────────────────────────────
# THE ICP RUBRIC  —  ENTERPRISE
#
# This file is the whole point of the project. Everything else is plumbing.
# You are encoding *your* judgment about what a good-fit account looks like,
# in a form a machine can apply consistently to ten thousand companies.
#
# Edit this freely. When you change it, the cache invalidates automatically
# (scores are keyed by a fingerprint of this file), so you can A/B rubrics.
#
# A mid-market version of this rubric is kept at icp.yaml.midmarket.bak.
# ─────────────────────────────────────────────────────────────────────────────

name: "Enterprise B2B SaaS, 1000+ employees, sells to revenue teams, committee-led sales cycle"

description: >
  We sell into large revenue organisations. Our best customers are established
  B2B software companies with a thousand or more employees, a named CRO or
  Chief Revenue Officer, and a sales motion run by committee: named accounts,
  solution engineers, security reviews and procurement. The buying centre is
  sales, marketing or revenue operations — not IT, not finance, not developers.
  Size alone is not enough. A twenty-thousand-person company that sells to
  engineers is a bad account no matter how big it is, and that distinction is
  the one this rubric has to get right.

# Each dimension is scored 0-3 by the model, and must be justified with a
# verbatim quote from the company's own website. No quote, no points.
dimensions:
  - key: segment
    weight: 1.0
    question: >
      Is this a B2B software or tech-enabled services company whose customers
      are other businesses?
    guidance:
      "3": "Clearly B2B software. Sells a product to other companies."
      "2": "B2B, but services-led or a hybrid rather than pure software."
      "1": "Mixed B2B/B2C, or the buyer is ambiguous."
      "0": "Consumer, non-profit, government, or not a company at all."

  - key: buying_centre
    weight: 2.0   # the heaviest dimension: WHO they sell to decides fit, not size
    question: >
      Does this company sell to sales, marketing or revenue operations teams?
      Look at who the product is pitched at, the job titles in customer quotes,
      the use cases on the homepage, and the language on the pricing page.
    guidance:
      "3": "Explicitly sold to sales, marketing, RevOps or a CRO. Revenue teams are the named buyer."
      "2": "Revenue-adjacent — customer success, partnerships, or a horizontal product with a clear GTM use case."
      "1": "Sold to some other function: IT, security, finance, HR, engineering."
      "0": "Sold to developers or to consumers. Wrong buying centre entirely."

  - key: enterprise_scale
    weight: 1.5
    question: >
      Does the site suggest 1000+ employees? Look for multiple global offices,
      publicly traded or late-stage language, named enterprise customer logos,
      analyst recognition (Gartner, Forrester), and the breadth of open roles.
    guidance:
      "3": "Unambiguously large: global offices, public company or very late stage, Fortune-500 logos, analyst placements."
      "2": "Large but the evidence is indirect, or it reads like several hundred rather than thousands."
      "1": "Clearly mid-market or smaller — a single office, a small team page, under a few hundred staff."
      "0": "No usable size signal anywhere on the site."

  - key: procurement_maturity
    weight: 1.0
    question: >
      Is there evidence of an enterprise procurement surface — a trust or
      security centre, SOC 2 or ISO certification, a DPA or legal page,
      published SLAs, SSO and SAML support, or a dedicated enterprise tier?
    guidance:
      "3": "Full enterprise surface: trust centre, named certifications, SSO/SAML, enterprise tier."
      "2": "Some of it — a security page or an enterprise plan, but thin."
      "1": "Minimal. Self-serve signup with no compliance or security story."
      "0": "Nothing of the kind anywhere on the site."

  - key: buying_trigger
    weight: 1.0
    question: >
      Is there a live trigger suggesting they are rebuilding or scaling revenue
      operations right now? A new CRO, RevOps or GTM systems hiring, an
      acquisition, or expansion into a new market or segment.
    guidance:
      "3": "Explicit, dated trigger: an open RevOps/GTM systems role, a new CRO, an announced acquisition."
      "2": "A softer trigger: general revenue-team hiring, a new region, a new product line."
      "1": "Nothing current, but the company is clearly active."
      "0": "Site looks dormant or unmaintained."

# Weighted total is normalised to 0-100 before tiering, so you can reweight
# dimensions without re-tuning these numbers.
tiers:
  a_min: 75   # work it now
  b_min: 55   # nurture
  # anything below b_min is Tier C - do not spend a rep's time on it

# The score at or above which we call the account "fit" when scoring the
# eval set. Keep this equal to b_min unless you have a reason not to.
fit_threshold: 55
